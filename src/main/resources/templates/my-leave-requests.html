<!DOCTYPE html>
<html lang="en">



<head th:replace="~{fragments/common_header :: head('View Leaves - Leave Management System')}"></head>

<body class="bg-gray-50">
    <div class="flex min-h-screen">
        <!-- Dynamic Navigation Sidebar -->
        <div th:replace="~{fragments/layout-parts :: dynamic_sidebar}"></div>

        <!-- Main Content -->
        <main class="flex-1 p-8">
            <div class="mb-8">
                <h1 class="text-3xl font-semibold text-gray-900">My Leave Requests</h1>
                <p class="text-gray-500 mt-1">View and manage your leave requests</p>
            </div>

            <!-- Filter Tabs -->
            <div class="mb-6 flex items-center gap-2 border-b border-gray-200">
                <button class="px-4 py-3 text-blue-600 border-b-2 border-blue-600 font-medium"
                    th:text="'All (' + ${allCount} + ')'"></button>
                <button class="px-4 py-3 text-gray-600 hover:text-gray-900"
                    th:text="'Pending (' + ${pendingCount} + ')'"></button>
                <button class="px-4 py-3 text-gray-600 hover:text-gray-900">
                    Approved (5)
                </button>
                <button class="px-4 py-3 text-gray-600 hover:text-gray-900">
                    Rejected (1)
                </button>
            </div>

            <!-- Leave Requests List -->
            <div class="space-y-4">
                <!-- Pending Leave Request -->


                <div th:each="leaveRequest : ${leaveRequestList}"
                     class="bg-white rounded-xl border border-gray-200 p-6 hover:shadow-lg transition-shadow">
                    <div class="flex items-start justify-between mb-4">
                        <div class="flex items-center gap-4">
                            <div class="w-12 h-12 rounded-lg flex items-center justify-center"
                                style="background-color: rgba(59, 130, 246, 0.2);">
                                <svg class="w-6 h-6" style="color: #3b82f6;" fill="none" stroke="currentColor"
                                    viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z">
                                    </path>
                                </svg>
                            </div>
                            <div>
                                <h3 class="font-semibold text-gray-900" th:text="${leaveRequest.leaveType}"></h3>
                                <p class="text-sm text-gray-500 mt-1" th:text="${leaveRequest.leavePeriod}"></p>
                            </div>
                        </div>
                        <div th:switch="${#strings.toString(leaveRequest.leaveStatus)}">
                            <span th:case="'APPLIED'"
                                class="px-4 py-2 rounded-lg text-sm font-medium border bg-blue-50 text-blue-700 border-blue-200">
                                Applied</span>
                            <span th:case="'UPDATED'"
                                class="px-4 py-2 rounded-lg text-sm font-medium border bg-purple-50 text-purple-700 border-purple-200">Updated</span>
                            <span th:case="'APPROVED'"
                                class="px-4 py-2 rounded-lg text-sm font-medium border bg-green-50 text-green-700 border-green-200">Approved</span>
                            <span th:case="'REJECTED'"
                                class="px-4 py-2 rounded-lg text-sm font-medium border bg-red-50 text-red-700 border-red-200">Rejected</span>
                            <span th:case="'CANCELLED'"
                                class="px-4 py-2 rounded-lg text-sm font-medium border bg-orange-50 text-orange-700 border-orange-200">Cancelled</span>
                            <span th:case="'DELETED'"
                                class="px-4 py-2 rounded-lg text-sm font-medium border bg-gray-50 text-gray-700 border-gray-200">Deleted</span>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
                        <div>
                            <p class="text-xs text-gray-500 mb-1">Duration</p>
                            <p class="text-sm font-medium text-gray-900" th:text="${leaveRequest.leavePeriod}"></p>
                        </div>
                        <div>
                            <p class="text-xs text-gray-500 mb-1">Applied On</p>
                            <p class="text-sm font-medium text-gray-900" th:text="${leaveRequest.leaveAppliedOn}"></p>
                        </div>
                        <div>
                            <p class="text-xs text-gray-500 mb-1">Approver</p>
                            <p class="text-sm font-medium text-gray-900" th:text="${leaveRequest.leaveApprover}"></p>
                        </div>
                    </div>

                    <div class="bg-gray-50 rounded-lg p-3 mb-4">
                        <p class="text-xs text-gray-500 mb-1">Reason</p>
                        <p class="text-sm text-gray-700" th:text="${leaveRequest.reason}"></p>
                    </div>

                    <div th:replace="~{fragments/view-my-requests-components/status-stepper :: status_stepper(${leaveRequest})}">
                    </div>


                    <div th:switch="${leaveRequest.leaveStatus}">
                        <div th:case="'PENDING'">
                            <div class="flex gap-2">
                                <button
                                    class=" w-full px-4 py-2 text-sm text-red-600 border border-red-300 rounded-lg hover:bg-red-50 transition-colors">
                                    Cancel Request
                                </button>
                            </div>
                        </div>

                        <div th:case="'APPROVED'">
                            <div class="bg-green-50 border border-green-200 rounded-lg p-3 mb-4">
                                <div class="flex items-start gap-2">
                                    <svg class="w-5 h-5 text-green-600 mt-0.5" fill="none" stroke="currentColor"
                                        viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                            d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                                    </svg>
                                    <div>
                                        <p class="text-sm font-medium text-green-900" th:text="'Approved on ' + ${leaveRequest.leaveApprovalTransactionDate}"></p>
                                        <p class="text-xs text-green-700 mt-1"
                                            th:text="${leaveRequest.leaveApprovalReason}">Sarah Manager</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div th:case="'REJECTED'">
                            <div class="bg-red-50 border border-red-200 rounded-lg p-3 mb-4">
                                <div class="flex items-start gap-2">
                                    <svg class="w-5 h-5 text-red-600 mt-0.5" fill="none" stroke="currentColor"
                                        viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                            d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z">
                                        </path>
                                    </svg>
                                    <div>
                                        <p class="text-sm font-medium text-red-900"
                                            th:text="${leaveRequest.leaveApprovalTransactionDate}"></p>
                                        <p class="text-xs text-red-700 mt-1"
                                            th:text="${leaveRequest.leaveApprovalReason}"></p>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div th:case="'CANCELLED'">
                            <div class="bg-orange-50 border border-orange-200 rounded-lg p-3 mb-4">
                                <div class="flex items-start gap-2">
                                    <svg class="w-5 h-5 text-orange-600 mt-0.5" fill="none" stroke="currentColor"
                                        viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                            d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z">
                                        </path>
                                    </svg>
                                    <div>
                                        <p class="text-sm font-medium text-orange-900"
                                            th:text="${leaveRequest.leaveApprovalTransactionDate}"></p>
                                        <p class="text-xs text-orange-700 mt-1"
                                            th:text="${leaveRequest.leaveApprovalReason}"></p>
                                    </div>
                                </div>
                            </div>
                        </div>



                    </div>
                </div>

            </div>
        </main>
    </div>
</body>

</html>
