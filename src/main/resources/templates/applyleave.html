<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/common_header :: head('Apply for Leave')}"></head>

<body class="bg-gray-50">
	<div class="flex min-h-screen">
	        <div th:if="${userRole == 'MANAGER'}">
	             <div th:replace="~{fragments/manager_left_navigation_bar :: manager_navigation_bar(${userRole})}"></div>
	        </div>
	        
	        <div th:if="${userRole == 'STAFF'}">
	             <div th:replace="~{fragments/staff_left_navigation_bar :: staff_navigation_bar}"></div>
	        </div>

        <main class="flex-1 p-8">
            <div class="mb-8">
                <h1 class="text-3xl font-semibold text-gray-900">Apply for Leave</h1>
                <p class="text-gray-500 mt-1">Submit a new leave request</p>
            </div>

            <div class="max-w-3xl">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
                    <div class="bg-white rounded-xl border border-gray-200 p-4">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-lg flex items-center justify-center bg-blue-100">
                                <svg class="w-5 h-5 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                            </div>
                            <div>
                                <p class="text-xs text-gray-500">Annual Leave</p>
                                <p class="text-lg font-semibold text-gray-900">
                                    <span th:text="${annualBalance}">15</span> days
                                </p>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="bg-white rounded-xl border border-gray-200 p-6">
                    <h2 class="text-lg font-semibold text-gray-900 mb-6">Leave Application Form</h2>
                    
                    <form th:action="@{/leave/apply}" th:object="${leaveApp}" method="POST" class="space-y-6">
						<div>
						    <label class="block text-sm font-medium text-gray-700 mb-2">Leave Type *</label>
						    <select th:field="*{leaveType}" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
						        <option value="">Select leave type...</option>
						        <option th:each="type : ${leaveTypes}" 
						                th:value="${type}" 
						                th:text="${type}"></option>
						    </select>
						</div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">Start Date *</label>
                                <input type="date" th:field="*{startDate}" class="w-full px-4 py-3 border border-gray-300 rounded-lg">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">End Date *</label>
                                <input type="date" th:field="*{endDate}" class="w-full px-4 py-3 border border-gray-300 rounded-lg">
                            </div>
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Reason *</label>
                            <textarea th:field="*{reason}" rows="4" class="w-full px-4 py-3 border border-gray-300 rounded-lg"></textarea>
                        </div>

                        <div class="flex gap-3">
                            <a th:href="@{/dashboard}" class="flex-1 px-6 py-3 border border-gray-300 text-center text-gray-700 rounded-lg hover:bg-gray-50">Cancel</a>
                            <button type="submit" class="flex-1 px-6 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700">Submit Request</button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
