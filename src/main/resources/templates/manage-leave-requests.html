<!DOCTYPE html>
<html lang="en">
<head th:replace="~{fragments/common_header :: head('Manage Leave Requests - Leave Management System')}">
</head>

<body class="bg-gray-50">
	<div class="flex min-h-screen">
		<!-- Manager Navigation Sidebar -->
		<div th:replace="~{fragments/manager_left_navigation_bar :: manager_navigation_bar('Manager')}"></div>

        <!-- Main Content -->
        <main class="flex-1 p-8">
            <div class="mb-8">
                <h1 class="text-3xl font-semibold text-gray-900">Manage Leave Requests</h1>
                <p class="text-gray-500 mt-1">Review and approve team leave requests</p>
            </div>

            <!-- Stats & Filters Card -->
            <div class="bg-white rounded-xl border border-gray-200 p-6 mb-6">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-sm text-gray-600">Pending Approvals</p>
                        <p th:text="${pendingCount}" class="text-3xl font-semibold text-gray-900 mt-1">count</p>
                    </div>
                    <div class="flex gap-2">
                        <button class="filter-btn px-4 py-2 rounded-lg bg-blue-600 text-white">
                            All
                        </button>
                        <button class="filter-btn px-4 py-2 rounded-lg bg-gray-100 text-gray-700 hover:bg-gray-200">
                            Pending
                        </button>
                        <button class="filter-btn px-4 py-2 rounded-lg bg-gray-100 text-gray-700 hover:bg-gray-200">
                            Approved
                        </button>
                        <button class="filter-btn px-4 py-2 rounded-lg bg-gray-100 text-gray-700 hover:bg-gray-200">
                            Rejected
                        </button>
                    </div>
                </div>
            </div>

            <!-- Leave Request Cards -->
            <div class="space-y-4">
                <!-- Pending Request 1 - John Doe -->
                <div th:each="request : ${teamRequests}" class="leave-card bg-white rounded-xl border-2 border-yellow-200 p-6 shadow-sm">
                    <div class="flex items-start gap-4 mb-4">
                        <div class="w-14 h-14 bg-gradient-to-br from-blue-500 to-blue-600 rounded-full flex items-center justify-center flex-shrink-0">
                            <span class="text-white font-semibold text-lg">JD</span>
                        </div>
                        <div class="flex-1">
                            <div class="flex items-start justify-between mb-2">
                                <div>
                                    <h3 th:text="${request.employeeName}" class="text-lg font-semibold text-gray-900">Name</h3>
                                    <p th:text="${request.department}" class="text-sm text-gray-500">Department</p>
                                </div>
                                <div class="flex items-center gap-2 bg-yellow-50 px-3 py-1 rounded-lg border border-yellow-200">
                                    <svg class="w-4 h-4 text-yellow-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
                                    </svg>
                                    <span th:text="${request.status}" class="text-sm font-medium text-yellow-700">Status</span>
                                </div>
                            </div>

                            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mt-4 mb-4">
                                <div class="bg-gray-50 rounded-lg p-3">
                                    <p class="text-xs text-gray-500 mb-1">Leave Type</p>
                                    <p th:text="${request.leaveType}" class="text-sm font-medium text-gray-900 capitalize">Type</p>
                                </div>
                                <div class="bg-gray-50 rounded-lg p-3">
                                    <div class="flex items-center gap-2">
                                        <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                                        </svg>
                                        <div>
                                            <p class="text-xs text-gray-500 mb-1">Duration</p>
                                            <p th:text="${#temporals.format(request.startDate, 'dd MMM')} + ' - ' + ${#temporals.format(request.endDate, 'dd MMM yyyy')}"
												class="text-sm font-medium text-gray-900">May 5 - May 6</p>
                                        </div>
                                    </div>
                                </div>
                                <div class="bg-gray-50 rounded-lg p-3">
                                    <div class="flex items-center gap-2">
                                        <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                                        </svg>
                                        <div>
                                            <p class="text-xs text-gray-500 mb-1">Total Days</p>
                                            <p th:text="${#numbers.formatDecimal(request.totalDays, 1, 1)} + ' days'" 
												class="text-sm font-medium text-gray-900">2 days</p>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="bg-blue-50 rounded-lg p-4 mb-4">
                                <p class="text-xs font-medium text-blue-900 mb-1">Reason:</p>
                                <p th:text="${request.reason} " class="text-sm text-blue-800">reason</p>
                            </div>

                            <div th:text="'Submitted on ' + ${request.submittedDate}" class="text-xs text-gray-500 mb-4">
                                Submitted on March 30, 2026
                            </div>

                            <div class="flex gap-3">
                                <button class="flex-1 flex items-center justify-center gap-2 px-6 py-3 bg-green-600 text-white rounded-lg hover:bg-green-700 transition-colors font-medium shadow-sm">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                                    </svg>
                                    Approve Request
                                </button>
                                <button class="flex-1 flex items-center justify-center gap-2 px-6 py-3 bg-red-600 text-white rounded-lg hover:bg-red-700 transition-colors font-medium shadow-sm">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                                    </svg>
                                    Reject Request
                                </button>
                            </div>
                        </div>
                    </div>
                </div>


            </div>
        </main>
    </div>

    <script>
        // Simple filter functionality for demonstration
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                // Remove active state from all buttons
                document.querySelectorAll('.filter-btn').forEach(b => {
                    b.classList.remove('bg-blue-600', 'bg-yellow-600', 'bg-green-600', 'bg-red-600', 'text-white');
                    b.classList.add('bg-gray-100', 'text-gray-700');
                });

                // Add active state to clicked button
                this.classList.remove('bg-gray-100', 'text-gray-700');

                const filterText = this.textContent.trim().toLowerCase();
                if (filterText === 'all') {
                    this.classList.add('bg-blue-600', 'text-white');
                } else if (filterText === 'pending') {
                    this.classList.add('bg-yellow-600', 'text-white');
                } else if (filterText === 'approved') {
                    this.classList.add('bg-green-600', 'text-white');
                } else if (filterText === 'rejected') {
                    this.classList.add('bg-red-600', 'text-white');
                }
            });
        });

        // Demo approve/reject functionality
        document.querySelectorAll('button').forEach(btn => {
            if (btn.textContent.includes('Approve') || btn.textContent.includes('Reject')) {
                btn.addEventListener('click', function() {
                    alert('This is a static HTML demo. In the live application, this would ' +
                          (this.textContent.includes('Approve') ? 'approve' : 'reject') +
                          ' the leave request.');
                });
            }
        });
    </script>
</body>
</html>
