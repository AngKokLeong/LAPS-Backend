version: 0.0
os: linux
files:
  - source: ROOT.war
    destination: /opt/tomcat/webapps/
hooks:
  ApplicationStop:
    - location: scripts/stop_app.sh
      timeout: 30
      runas: root
  BeforeInstall:
    - location: scripts/clean_webapps.sh
      timeout: 30
      runas: root
  AfterInstall:
    - location: scripts/start_app.sh
      timeout: 60
      runas: root
