<!DOCTYPE html>
<html lang="en">

<head th:replace="~{fragments/common_header :: head('Submit OT Claim - Leave Management System')}">
</head>

<body class="bg-gray-50">
	<div class="flex min-h-screen">
		<!-- Staff Navigation Sidebar -->
		<div th:replace="~{fragments/staff_left_navigation_bar :: navigation_bar('Staff')}"></div>

		<!-- Main Content -->
		<main class="flex-1 overflow-auto">
			<div class="p-8 max-w-3xl mx-auto">
				<div class="mb-8">
					<h1 class="text-2xl font-semibold text-gray-900">Submit Overtime Claim</h1>
					<p class="text-sm text-gray-500 mt-1">Fill in the details of your overtime work</p>
				</div>

				<form id="otForm" class="bg-white rounded-lg border border-gray-200 p-6">
					<div class="space-y-6">
						<!-- Start Date & Time -->
						<div>
							<label class="block text-sm font-medium text-gray-700 mb-3">
								OT Start Date & Time
							</label>
							<div class="grid grid-cols-2 gap-4">
								<div>
									<label for="startDate" class="block text-xs text-gray-500 mb-1">
										Date
									</label>
									<input type="date" id="startDate" name="startDate" required
										class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent" />
								</div>
								<div>
									<label for="startTime" class="block text-xs text-gray-500 mb-1">
										Time
									</label>
									<select id="startTime" name="startTime" required
										class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
										<option value="">Select time</option>
									</select>
								</div>
							</div>
						</div>

						<!-- End Date & Time -->
						<div>
							<label class="block text-sm font-medium text-gray-700 mb-3">
								OT End Date & Time
							</label>
							<div class="grid grid-cols-2 gap-4">
								<div>
									<label for="endDate" class="block text-xs text-gray-500 mb-1">
										Date
									</label>
									<input type="date" id="endDate" name="endDate" required
										class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent" />
								</div>
								<div>
									<label for="endTime" class="block text-xs text-gray-500 mb-1">
										Time
									</label>
									<select id="endTime" name="endTime" required
										class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
										<option value="">Select time</option>
									</select>
								</div>
							</div>
						</div>

						<!-- Description -->
						<div>
							<label for="description" class="block text-sm font-medium text-gray-700 mb-2">
								OT Description
							</label>
							<textarea id="description" name="description" required rows="4"
								placeholder="Describe the work performed during overtime..."
								class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent resize-none"></textarea>
						</div>

						<!-- Submit Button -->
						<div class="flex gap-3 pt-4">
							<button type="submit"
								class="flex items-center gap-2 px-6 py-2.5 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors">
								<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
									<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
										d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
								</svg>
								Submit OT Claim
							</button>
							<button type="button" onclick="clearForm()"
								class="px-6 py-2.5 border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-50 transition-colors">
								Clear Form
							</button>
						</div>
					</div>
				</form>
			</div>
		</main>
	</div>

	<script>
		// Generate time options in 5-minute intervals
		function generateTimeOptions() {
			const times = [];
			for (let hour = 0; hour < 24; hour++) {
				for (let minute = 0; minute < 60; minute += 5) {
					const h = hour.toString().padStart(2, '0');
					const m = minute.toString().padStart(2, '0');
					times.push(`${h}:${m}`);
				}
			}
			return times;
		}

		// Populate time dropdowns
		const timeOptions = generateTimeOptions();
		const startTimeSelect = document.getElementById('startTime');
		const endTimeSelect = document.getElementById('endTime');

		timeOptions.forEach(time => {
			const option1 = document.createElement('option');
			option1.value = time;
			option1.textContent = time;
			startTimeSelect.appendChild(option1);

			const option2 = document.createElement('option');
			option2.value = time;
			option2.textContent = time;
			endTimeSelect.appendChild(option2);
		});

		// Handle form submission
		document.getElementById('otForm').addEventListener('submit', function (e) {
			e.preventDefault();
			const formData = {
				startDate: document.getElementById('startDate').value,
				startTime: document.getElementById('startTime').value,
				endDate: document.getElementById('endDate').value,
				endTime: document.getElementById('endTime').value,
				description: document.getElementById('description').value
			};
			console.log('OT Claim submitted:', formData);
			alert('OT Claim submitted successfully!');
		});

		// Clear form function
		function clearForm() {
			document.getElementById('otForm').reset();
		}
	</script>
</body>

</html>
