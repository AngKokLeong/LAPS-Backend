AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Learner Lab template: creates VPC, EC2, and RDS MySQL.
  Credentials are supplied externally (e.g. GitHub Actions).

Parameters:
  VpcSecondOctet:
    Type: Number
    Default: 0
    MinValue: 0
    MaxValue: 255
    Description: >-
      Second octet for VPC CIDR (10.X.0.0/16). Change this value for each
      deployment to avoid CIDR conflicts. e.g. 0 = 10.0.0.0/16, 1 = 10.1.0.0/16

  DBUsername:
    Type: String
    NoEcho: true
    MinLength: 1
    MaxLength: 16

  DBPassword:
    Type: String
    NoEcho: true
    MinLength: 8
    MaxLength: 41


Resources:

  # ------------------
  # S3 Artifact Bucket
  # ------------------
  ArtifactBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${AWS::StackName}-artifacts-${AWS::AccountId}"

  ArtifactBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ArtifactBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: codedeploy.amazonaws.com
            Action:
              - s3:GetObject
            Resource: !Sub "${ArtifactBucket.Arn}/*"

  # ------------------
  # CodeDeploy Application
  # ------------------
  CodeDeployApp:
    Type: AWS::CodeDeploy::Application
    Properties:
      ApplicationName: !Sub "${AWS::StackName}-app"
      ComputePlatform: Server

  CodeDeployDeploymentGroup:
    Type: AWS::CodeDeploy::DeploymentGroup
    DependsOn: EC2Instance
    Properties:
      ApplicationName: !Ref CodeDeployApp
      DeploymentGroupName: !Sub "${AWS::StackName}-dg"
      ServiceRoleArn: !Sub "arn:aws:iam::${AWS::AccountId}:role/LabRole"
      DeploymentConfigName: CodeDeployDefault.AllAtOnce
      Ec2TagFilters:
        - Key: DeployTarget
          Value: !Sub "${AWS::StackName}-ec2"
          Type: KEY_AND_VALUE
      DeploymentStyle:
        DeploymentType: IN_PLACE
        DeploymentOption: WITHOUT_TRAFFIC_CONTROL

  # ------------------
  # VPC & Networking
  # ------------------
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Sub "10.${VpcSecondOctet}.0.0/16"
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: SpringBootVPC


  InternetGateway:
    Type: AWS::EC2::InternetGateway

  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Sub "10.${VpcSecondOctet}.1.0/24"
      MapPublicIpOnLaunch: true
      AvailabilityZone: !Select [0, !GetAZs '']

  PrivateSubnetAZ1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Sub "10.${VpcSecondOctet}.2.0/24"
      MapPublicIpOnLaunch: false
      AvailabilityZone: !Select [0, !GetAZs '']

  PrivateSubnetAZ2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Sub "10.${VpcSecondOctet}.3.0/24"
      MapPublicIpOnLaunch: false
      AvailabilityZone: !Select [1, !GetAZs '']
   

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachGateway
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC

  PrivateSubnetAZ1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetAZ1
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnetAZ2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetAZ2
      RouteTableId: !Ref PrivateRouteTable

  # ------------------
  # Security Groups
  # ------------------
  EC2SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow SSH
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 8100
          ToPort: 8100
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 8443
          ToPort: 8443
          CidrIp: 0.0.0.0/0

  DBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow MySQL from EC2
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          SourceSecurityGroupId: !Ref EC2SecurityGroup

  # ------------------
  # EC2 Instance
  # ------------------

  EC2Instance:
    Type: AWS::EC2::Instance
    DependsOn:
      - PublicSubnetRouteTableAssociation
      - AttachGateway
      - MySQLDB
    CreationPolicy:
      ResourceSignal:
        Timeout: PT25M
    Properties:
      InstanceType: t3.micro
      KeyName: vockey
      IamInstanceProfile: LabInstanceProfile
      ImageId: ami-098e39bafa7e7303d
      SubnetId: !Ref PublicSubnet
      SecurityGroupIds:
        - !Ref EC2SecurityGroup
      Tags:
        - Key: DeployTarget
          Value: !Sub "${AWS::StackName}-ec2"
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          exec > /var/log/user-data.log 2>&1
          set -e

          # Trap to ensure cfn-signal always runs even if script fails
          trap '/opt/aws/bin/cfn-signal -e 1 --stack ${AWS::StackName} --resource EC2Instance --region ${AWS::Region}; exit 1' ERR

          # --- 1. System update & cfn-bootstrap ---
          dnf update -y

          # --- 2. Java 17 (Corretto) ---
          dnf install -y java-17-amazon-corretto

          # --- 3. Tomcat 10 ---
          set +e; useradd -r -M -U -d /opt/tomcat -s /bin/false tomcat; set -e

          cd /opt
          wget -q --tries=3 --timeout=60 https://archive.apache.org/dist/tomcat/tomcat-10/v10.1.18/bin/apache-tomcat-10.1.18.tar.gz
          tar -xzf apache-tomcat-10.1.18.tar.gz
          mv apache-tomcat-10.1.18 tomcat
          rm apache-tomcat-10.1.18.tar.gz

          # Install MariaDb client
          dnf install mariadb105 -y


          # Set permissions before creating files
          chown -R tomcat:tomcat /opt/tomcat
          chmod -R 755 /opt/tomcat/bin
          chmod -R 777 /opt/tomcat/logs /opt/tomcat/temp /opt/tomcat/work

          # Rename Tomcat manager to admin-manager
          mv /opt/tomcat/webapps/manager /opt/tomcat/webapps/admin-manager

          # Create webapps dir and set permissions
          mkdir -p /opt/tomcat/webapps
          chown -R tomcat:tomcat /opt/tomcat/webapps

          # Generate self-signed SSL certificate FIRST before server.xml update
          keytool -genkeypair \
            -alias tomcat \
            -keyalg RSA \
            -keysize 2048 \
            -validity 365 \
            -keystore /opt/tomcat/conf/keystore.jks \
            -storepass changeit \
            -keypass changeit \
            -noprompt \
            -dname "CN=localhost, OU=Dev, O=LAPS, L=Singapore, S=Singapore, C=SG"
          chown tomcat:tomcat /opt/tomcat/conf/keystore.jks
          chmod 640 /opt/tomcat/conf/keystore.jks

          # Update server.xml - remove HTTP connector block and enable HTTPS
          echo 'with open("/opt/tomcat/conf/server.xml", "r") as f: lines = f.readlines()' > /tmp/fix_server.py
          echo 'result = []' >> /tmp/fix_server.py
          echo 'skip = False' >> /tmp/fix_server.py
          echo 'for line in lines:' >> /tmp/fix_server.py
          echo '    if "<Connector port=\"8080\"" in line or "<Connector port=\"8443\"" in line: skip = True' >> /tmp/fix_server.py
          echo '    if skip and ("/>" in line or "</Connector>" in line): skip = False; continue' >> /tmp/fix_server.py
          echo '    if not skip: result.append(line)' >> /tmp/fix_server.py
          echo 'ssl = "    <Connector port=\"8443\" protocol=\"org.apache.coyote.http11.Http11NioProtocol\" maxThreads=\"150\" SSLEnabled=\"true\">\n        <SSLHostConfig>\n            <Certificate certificateKeystoreFile=\"conf/keystore.jks\" certificateKeystorePassword=\"changeit\" type=\"RSA\" />\n        </SSLHostConfig>\n    </Connector>\n    <Connector port=\"8100\" protocol=\"HTTP/1.1\" connectionTimeout=\"20000\" />\n"' >> /tmp/fix_server.py
          echo 'final = []' >> /tmp/fix_server.py
          echo 'for line in result:' >> /tmp/fix_server.py
          echo '    if "</Service>" in line: final.append(ssl)' >> /tmp/fix_server.py
          echo '    final.append(line)' >> /tmp/fix_server.py
          echo 'with open("/opt/tomcat/conf/server.xml", "w") as f: f.writelines(final)' >> /tmp/fix_server.py
          python3 /tmp/fix_server.py

          # Create setenv.sh for Tomcat to pick up JAVA_OPTS
          JAVA_HOME_PATH=$(dirname $(dirname $(readlink -f $(which java))))
          echo '#!/bin/bash' > /opt/tomcat/bin/setenv.sh
          echo "export JAVA_HOME=$JAVA_HOME_PATH" >> /opt/tomcat/bin/setenv.sh
          echo "export JAVA_OPTS=\"-Dspring.profiles.active=prod -Dspring.datasource.url=jdbc:mysql://${MySQLDB.Endpoint.Address}:3306/lapsdb?createDatabaseIfNotExist=true -Dspring.datasource.username=${DBUsername} -Dspring.datasource.password=${DBPassword}\"" >> /opt/tomcat/bin/setenv.sh
          chmod +x /opt/tomcat/bin/setenv.sh

          # Create systemd service for Tomcat
          echo '[Unit]' > /etc/systemd/system/tomcat.service
          echo 'Description=Apache Tomcat 10' >> /etc/systemd/system/tomcat.service
          echo 'After=network.target' >> /etc/systemd/system/tomcat.service
          echo >> /etc/systemd/system/tomcat.service
          echo '[Service]' >> /etc/systemd/system/tomcat.service
          echo 'Type=forking' >> /etc/systemd/system/tomcat.service
          echo 'User=tomcat' >> /etc/systemd/system/tomcat.service
          echo 'Group=tomcat' >> /etc/systemd/system/tomcat.service
          echo "Environment=JAVA_HOME=$JAVA_HOME_PATH" >> /etc/systemd/system/tomcat.service
          echo 'Environment=CATALINA_HOME=/opt/tomcat' >> /etc/systemd/system/tomcat.service
          echo 'Environment=CATALINA_BASE=/opt/tomcat' >> /etc/systemd/system/tomcat.service
          echo 'Environment=CATALINA_PID=/opt/tomcat/temp/tomcat.pid' >> /etc/systemd/system/tomcat.service
          echo 'ExecStart=/opt/tomcat/bin/startup.sh' >> /etc/systemd/system/tomcat.service
          echo 'ExecStop=/opt/tomcat/bin/shutdown.sh' >> /etc/systemd/system/tomcat.service
          echo 'Restart=on-failure' >> /etc/systemd/system/tomcat.service
          echo >> /etc/systemd/system/tomcat.service
          echo '[Install]' >> /etc/systemd/system/tomcat.service
          echo 'WantedBy=multi-user.target' >> /etc/systemd/system/tomcat.service

          systemctl daemon-reload
          systemctl enable tomcat
          systemctl start tomcat

          # Wait for Tomcat to be ready on port 8100
          for i in $(seq 1 12); do
            curl -sf http://localhost:8100 && break
            echo "Waiting for Tomcat... attempt $i"
            sleep 5
          done
          curl -sf http://localhost:8100

          # --- 4. CodeDeploy agent ---
          dnf install -y ruby wget
          cd /tmp
          wget -q --tries=3 --timeout=60 https://aws-codedeploy-${AWS::Region}.s3.${AWS::Region}.amazonaws.com/latest/install
          chmod +x ./install
          ./install auto
          systemctl enable codedeploy-agent
          systemctl start codedeploy-agent

          # --- 4b. Verify MySQL connectivity ---
          timeout 10 bash -c "echo > /dev/tcp/${MySQLDB.Endpoint.Address}/3306"

          # --- 5. Signal CloudFormation ---
          trap - ERR
          SIGNAL_CODE=0

          java -version || SIGNAL_CODE=1
          systemctl is-active tomcat || SIGNAL_CODE=1
          systemctl is-active codedeploy-agent || SIGNAL_CODE=1

          /opt/aws/bin/cfn-signal -e $SIGNAL_CODE \
            --stack ${AWS::StackName} \
            --resource EC2Instance \
            --region ${AWS::Region}


  # ------------------
  # RDS MySQL
  # ------------------
  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: RDS private subnets in two AZs
      SubnetIds:
        - !Ref PrivateSubnetAZ1
        - !Ref PrivateSubnetAZ2

  MySQLDB:
    Type: AWS::RDS::DBInstance
    Properties:
      Engine: mysql
      DBInstanceClass: db.t3.micro
      AllocatedStorage: 20
      DBName: lapsdb
      MasterUsername: !Ref DBUsername
      MasterUserPassword: !Ref DBPassword
      DBSubnetGroupName: !Ref DBSubnetGroup
      VPCSecurityGroups:
        - !GetAtt DBSecurityGroup.GroupId
      PubliclyAccessible: false
      BackupRetentionPeriod: 0
      DeletionProtection: false

Outputs:
  VPCId:
    Value: !Ref VPC

  CloudFormationStackName:
    Value: ${AWS::StackName}

  ArtifactBucketName:
    Value: !Ref ArtifactBucket

  EC2PublicIP:
    Value: !GetAtt EC2Instance.PublicIp

  EC2PublicDNSName:
    Value: !GetAtt EC2Instance.PublicDnsName

  MySQLEndpoint:
    Value: !GetAtt MySQLDB.Endpoint.Address

  CodeDeployAppName:
    Value: !Ref CodeDeployApp

  CodeDeployDeploymentGroupName:
    Value: !Ref CodeDeployDeploymentGroup
  


  