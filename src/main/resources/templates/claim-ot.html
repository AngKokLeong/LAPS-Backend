<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Submit Overtime Claim</title>
	<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50">
	<div class="flex min-h-screen">
		<!-- Sidebar -->
		<div class="w-64 bg-white border-r border-gray-200 h-screen flex flex-col">
			<div class="p-6 border-b border-gray-200">
				<h1 class="font-semibold text-xl">Leave Application System</h1>
				<p class="text-sm text-gray-500 mt-1">John Doe</p>
				<p class="text-xs text-gray-400">Employee</p>
			</div>

			<nav class="flex-1 p-4 overflow-y-auto">
				<ul class="space-y-2">
					<li>
						<a href="/"
							class="flex items-center gap-3 px-4 py-3 rounded-lg text-gray-700 hover:bg-gray-50 transition-colors">
							<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
								<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
									d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
							</svg>
							<span>Dashboard</span>
						</a>
					</li>
					<li>
						<a href="/applyleave"
							class="flex items-center gap-3 px-4 py-3 rounded-lg text-gray-700 hover:bg-gray-50 transition-colors">
							<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
								<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
									d="M12 4v16m8-8H4" />
							</svg>
							<span>Apply Leave</span>
						</a>
					</li>
					<li>
						<a href="/my-leaves"
							class="flex items-center gap-3 px-4 py-3 rounded-lg text-gray-700 hover:bg-gray-50 transition-colors">
							<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
								<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
									d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
							</svg>
							<span>My Leaves</span>
						</a>
					</li>
					<li>
						<a href="/movement-register"
							class="flex items-center gap-3 px-4 py-3 rounded-lg text-gray-700 hover:bg-gray-50 transition-colors">
							<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
								<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
									d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
							</svg>
							<span>Movement Register</span>
						</a>
					</li>
					<li>
						<a href="claim-ot.html"
							class="flex items-center gap-3 px-4 py-3 rounded-lg bg-blue-50 text-blue-600 transition-colors">
							<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
								<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
									d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
							</svg>
							<span>Submit OT Claim</span>
						</a>
					</li>
				</ul>
			</nav>

			<div class="p-4 border-t border-gray-200">
				<button
					class="flex items-center gap-3 px-4 py-3 rounded-lg text-gray-700 hover:bg-gray-50 w-full transition-colors">
					<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
						<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
							d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
					</svg>
					<span>Logout</span>
				</button>
			</div>
		</div>

		<!-- Main Content -->
		<main class="flex-1 overflow-auto">
			<div class="p-8 max-w-3xl mx-auto">
				<div class="mb-8">
					<h1 class="text-2xl font-semibold text-gray-900">Submit Overtime Claim</h1>
					<p class="text-sm text-gray-500 mt-1">Fill in the details of your overtime work</p>
				</div>

				<form id="otForm" class="bg-white rounded-lg border border-gray-200 p-6">
					<div class="space-y-6">
						<!-- Start Date & Time -->
						<div>
							<label class="block text-sm font-medium text-gray-700 mb-3">
								OT Start Date & Time
							</label>
							<div class="grid grid-cols-2 gap-4">
								<div>
									<label for="startDate" class="block text-xs text-gray-500 mb-1">
										Date
									</label>
									<input type="date" id="startDate" name="startDate" required
										class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent" />
								</div>
								<div>
									<label for="startTime" class="block text-xs text-gray-500 mb-1">
										Time
									</label>
									<select id="startTime" name="startTime" required
										class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
										<option value="">Select time</option>
									</select>
								</div>
							</div>
						</div>

						<!-- End Date & Time -->
						<div>
							<label class="block text-sm font-medium text-gray-700 mb-3">
								OT End Date & Time
							</label>
							<div class="grid grid-cols-2 gap-4">
								<div>
									<label for="endDate" class="block text-xs text-gray-500 mb-1">
										Date
									</label>
									<input type="date" id="endDate" name="endDate" required
										class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent" />
								</div>
								<div>
									<label for="endTime" class="block text-xs text-gray-500 mb-1">
										Time
									</label>
									<select id="endTime" name="endTime" required
										class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
										<option value="">Select time</option>
									</select>
								</div>
							</div>
						</div>

						<!-- Description -->
						<div>
							<label for="description" class="block text-sm font-medium text-gray-700 mb-2">
								OT Description
							</label>
							<textarea id="description" name="description" required rows="4"
								placeholder="Describe the work performed during overtime..."
								class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent resize-none"></textarea>
						</div>

						<!-- Submit Button -->
						<div class="flex gap-3 pt-4">
							<button type="submit"
								class="flex items-center gap-2 px-6 py-2.5 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors">
								<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
									<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
										d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
								</svg>
								Submit OT Claim
							</button>
							<button type="button" onclick="clearForm()"
								class="px-6 py-2.5 border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-50 transition-colors">
								Clear Form
							</button>
						</div>
					</div>
				</form>
			</div>
		</main>
	</div>

	<script>
		// Generate time options in 5-minute intervals
		function generateTimeOptions() {
			const times = [];
			for (let hour = 0; hour < 24; hour++) {
				for (let minute = 0; minute < 60; minute += 5) {
					const h = hour.toString().padStart(2, '0');
					const m = minute.toString().padStart(2, '0');
					times.push(`${h}:${m}`);
				}
			}
			return times;
		}

		// Populate time dropdowns
		const timeOptions = generateTimeOptions();
		const startTimeSelect = document.getElementById('startTime');
		const endTimeSelect = document.getElementById('endTime');

		timeOptions.forEach(time => {
			const option1 = document.createElement('option');
			option1.value = time;
			option1.textContent = time;
			startTimeSelect.appendChild(option1);

			const option2 = document.createElement('option');
			option2.value = time;
			option2.textContent = time;
			endTimeSelect.appendChild(option2);
		});

		// Handle form submission
		document.getElementById('otForm').addEventListener('submit', function (e) {
			e.preventDefault();
			const formData = {
				startDate: document.getElementById('startDate').value,
				startTime: document.getElementById('startTime').value,
				endDate: document.getElementById('endDate').value,
				endTime: document.getElementById('endTime').value,
				description: document.getElementById('description').value
			};
			console.log('OT Claim submitted:', formData);
			alert('OT Claim submitted successfully!');
		});

		// Clear form function
		function clearForm() {
			document.getElementById('otForm').reset();
		}
	</script>
</body>

</html>
