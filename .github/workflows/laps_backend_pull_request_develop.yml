name: LAPS CI Pull Request to Develop

on: [push, pull_request]
  branches:
    - 'develop'

permissions:
  contents: read
  pull-requests: write

steps:
  - uses: actions/checkout@v5
  - uses: actions/setup-java@v5
    with:
      java-version: '17'
      distribution: 'adopt'
  
  - name: Run Maven verify phase
    run: mvn --batch-mode --update-snapshots verify