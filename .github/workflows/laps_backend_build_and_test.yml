name: LAPS-Backend Push Trigger

on: 
  push:

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'adopt'
      
      - name: Run Maven verify phase
        run: mvn --batch-mode --update-snapshots verify