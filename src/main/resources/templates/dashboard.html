<!DOCTYPE html>
<html lang="en">
	<head>
	    <head th:replace="~{fragments/common_header :: head('Dashboard - Leave Management System')}">
	  </head>
<body class="bg-gray-50">
    <div class="flex min-h-screen">
		<!-- Dynamic Navigation Sidebar -->
		<div th:replace="~{fragments/layout-parts :: dynamic_sidebar}"></div>

        <!-- Main Content -->
        <main class="flex-1 p-8">
            <div class="mb-8">
                <h1 class="text-3xl font-semibold text-gray-900">Dashboard</h1>
                <p class="text-gray-500 mt-1" th:text="'Welcome back, ' + ${#authentication.principal.employee.name} + '!'">Welcome back!</p>
            </div>

            <!-- Stats Cards -->
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
                <div class="bg-white rounded-xl border border-gray-200 p-6">
                    <div class="flex items-center justify-between mb-4">
                        <div class="w-12 h-12 bg-blue-100 rounded-lg flex items-center justify-center">
                            <svg class="w-6 h-6 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                            </svg>
                        </div>
                    </div>
                    <h3 id="totalLeaveDays" class="text-2xl font-semibold text-gray-900">15</h3>
                    <p class="text-sm text-gray-500 mt-1">Total Leave Days</p>
                </div>

                <div class="bg-white rounded-xl border border-gray-200 p-6">
                    <div class="flex items-center justify-between mb-4">
                        <div class="w-12 h-12 bg-green-100 rounded-lg flex items-center justify-center">
                            <svg class="w-6 h-6 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                            </svg>
                        </div>
                    </div>
                    <h3 id="daysUsed" class="text-2xl font-semibold text-gray-900">5</h3>
                    <p class="text-sm text-gray-500 mt-1">Days Used</p>
                </div>

                <div class="bg-white rounded-xl border border-gray-200 p-6">
                    <div class="flex items-center justify-between mb-4">
                        <div class="w-12 h-12 bg-purple-100 rounded-lg flex items-center justify-center">
                            <svg class="w-6 h-6 text-purple-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                            </svg>
                        </div>
                    </div>
                    <h3 id="pendingRequests" class="text-2xl font-semibold text-gray-900">2</h3>
                    <p class="text-sm text-gray-500 mt-1">Pending Requests</p>
                </div>

                <div class="bg-white rounded-xl border border-gray-200 p-6">
                    <div class="flex items-center justify-between mb-4">
                        <div class="w-12 h-12 bg-orange-100 rounded-lg flex items-center justify-center">
                            <svg class="w-6 h-6 text-orange-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path>
                            </svg>
                        </div>
                    </div>
                    <h3 id="daysRemaining" class="text-2xl font-semibold text-gray-900">10</h3>
                    <p class="text-sm text-gray-500 mt-1">Days Remaining</p>
                </div>
            </div>

            <!-- Recent Leaves -->
            <div class="bg-white rounded-xl border border-gray-200">
                <div class="px-6 py-4 border-b border-gray-200">
                    <h2 class="text-lg font-semibold text-gray-900">Recent Leave Requests</h2>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full">
                        <thead class="bg-gray-50 border-b border-gray-200">
                            <tr>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Type</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Start Date</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">End Date</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Days</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Status</th>
                            </tr>
                        </thead>
                        <tbody id="recentLeavesTable" class="divide-y divide-gray-200">
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script>
        function getStatusBadge(status) {
            let classes = "inline-flex px-2 py-1 rounded-full text-xs font-medium border ";
            let text = status;

            if (status === "APPLIED" || status === "UPDATED") {
                classes += "bg-yellow-100 text-yellow-700 border-yellow-200";
                text = "Pending";
            } else if (status === "APPROVED") {
                classes += "bg-green-100 text-green-700 border-green-200";
                text = "Approved";
            } else if (status === "REJECTED") {
                classes += "bg-red-100 text-red-700 border-red-200";
                text = "Rejected";
            } else {
                classes += "bg-gray-100 text-gray-700 border-gray-200";
            }

            return `<span class="${classes}">${text}</span>`;
        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString("en-US", {
                year: "numeric",
                month: "short",
                day: "numeric",
            });
        }

        function loadDashboard() {
            fetch("/api/staff/dashboard")
                .then((response) => {
                    if (!response.ok) {
                        throw new Error("Failed to load dashboard data");
                    }
                    return response.json();
                })
                .then((data) => {
                    // Update stats
                    document.getElementById("totalLeaveDays").textContent = data.totalLeaveDays;
                    document.getElementById("daysUsed").textContent = data.daysUsed;
                    document.getElementById("pendingRequests").textContent = data.pendingRequests;
                    document.getElementById("daysRemaining").textContent = data.daysRemaining;

                    // Update table
                    const tbody = document.getElementById("recentLeavesTable");
                    tbody.innerHTML = "";

                    if (data.recentLeaves.length === 0) {
                        tbody.innerHTML = `
                            <tr>
                                <td colspan="5" class="px-6 py-4 text-center text-gray-500">
                                    No recent leave requests found.
                                </td>
                            </tr>
                        `;
                        return;
                    }

                    data.recentLeaves.forEach((leave) => {
                        const row = `
                            <tr class="hover:bg-gray-50">
                                <td class="px-6 py-4 text-sm text-gray-900">${leave.type}</td>
                                <td class="px-6 py-4 text-sm text-gray-600">${formatDate(leave.startDate)}</td>
                                <td class="px-6 py-4 text-sm text-gray-600">${formatDate(leave.endDate)}</td>
                                <td class="px-6 py-4 text-sm text-gray-600">${leave.days}</td>
                                <td class="px-6 py-4">${getStatusBadge(leave.status)}</td>
                            </tr>
                        `;
                        tbody.innerHTML += row;
                    });
                })
                .catch((error) => {
                    console.error(error);
                    // Optionally show error in UI
                    const tbody = document.getElementById("recentLeavesTable");
                    tbody.innerHTML = `
                        <tr>
                            <td colspan="5" class="px-6 py-4 text-center text-red-600">
                                Failed to load recent leaves. Please refresh the page.
                            </td>
                        </tr>
                    `;
                });
        }

        document.addEventListener("DOMContentLoaded", loadDashboard);
    </script>
</body>
</html>
