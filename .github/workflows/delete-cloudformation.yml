name: Delete CloudFormation Stack

on:
  workflow_dispatch:
    inputs:
      aws_access_key_id:
        description: 'AWS Access Key ID'
        required: true
      aws_secret_access_key:
        description: 'AWS Secret Access Key'
        required: true
      aws_session_token:
        description: 'AWS Session Token'
        required: true
      stack_name:
        description: 'CloudFormation Stack Name'
        required: true
        default: 'laps-backend'

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Set lowercase stack name
        id: vars
        run: echo "stack_name=$(echo '${{ github.event.inputs.stack_name }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          aws-access-key-id: ${{ github.event.inputs.aws_access_key_id }}
          aws-secret-access-key: ${{ github.event.inputs.aws_secret_access_key }}
          aws-session-token: ${{ github.event.inputs.aws_session_token }}
          aws-region: us-east-1

      - name: Empty S3 Artifact Bucket
        run: |
          BUCKET="${{ steps.vars.outputs.stack_name }}-artifacts-$(aws sts get-caller-identity --query Account --output text)"
          echo "Emptying bucket: $BUCKET"
          aws s3 rm s3://$BUCKET --recursive || true

      - name: Delete CloudFormation Stack
        run: |
          aws cloudformation delete-stack \
            --stack-name ${{ steps.vars.outputs.stack_name }} \
            --region us-east-1

      - name: Wait for Stack Deletion
        run: |
          echo "Waiting for stack deletion to complete..."
          aws cloudformation wait stack-delete-complete \
            --stack-name ${{ steps.vars.outputs.stack_name }} \
            --region us-east-1
          echo "Stack deleted successfully"
