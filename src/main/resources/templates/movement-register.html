<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <head th:replace="~{fragments/common_header :: head('Movement Register - Leave Management System')}"></head>
</head>

<body class="bg-gray-50">
<div class="flex min-h-screen">

    <!-- Sidebar -->
    <div th:replace="~{fragments/layout-parts :: dynamic_sidebar}"></div>

    <!-- Main Content -->
    <main class="flex-1 overflow-auto">
        <div class="p-8">

            <!-- Page Header -->
            <div class="mb-8">
                <h1 class="text-3xl font-semibold text-gray-900">Movement Register</h1>
                <p class="text-gray-500 mt-1">
                    View all employees on approved leave during the selected month
                </p>
            </div>

            <!-- Month Navigation -->
            <div class="bg-white rounded-xl border border-gray-200 p-6 mb-6">

                <!-- Previous / Current / Next -->
                <div class="flex items-center justify-between mb-4">

                    <a th:href="@{/staff/movement-register(
                            month=${selectedMonth.minusMonths(1)},
                            size=${pageSize})}"
                       class="px-4 py-2 bg-gray-100 hover:bg-gray-200 rounded-lg text-xl font-semibold text-gray-900">
                        &larr;
                    </a>

                    <!-- Month Display -->
                    <div class="flex items-center gap-2">
                        <!-- Calendar Icon -->
                        <svg
                        class="w-5 h-5 text-blue-600"
                        fill="none"
                        stroke="currentColor"
                        viewBox="0 0 24 24">
                        <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                        </svg>
                        <span class="text-xl font-semibold text-gray-900"
                              th:text="${#temporals.format(selectedMonth.atDay(1), 'MMMM yyyy')}">
                        </span>
                    </div>

                    <a th:href="@{/staff/movement-register(
                            month=${selectedMonth.plusMonths(1)},
                            size=${pageSize})}"
                       class="px-4 py-2 bg-gray-100 hover:bg-gray-200 rounded-lg text-xl font-semibold text-gray-900">
                        &rarr;
                    </a>

                </div>

                <!-- Month Dropdown -->
                <form method="get" th:action="@{/staff/movement-register}">
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        Select Month
                    </label>

                    <select name="month"
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg"
                            onchange="this.form.submit()">

                        <option th:each="i : ${#numbers.sequence(-6,6)}"
                                th:value="${selectedMonth.plusMonths(i)}"
                                th:text="${#temporals.format(selectedMonth.plusMonths(i).atDay(1), 'MMMM yyyy')}"
                                th:selected="${selectedMonth.plusMonths(i).equals(selectedMonth)}">
                        </option>
                    </select>

                    <input type="hidden" name="size" th:value="${pageSize}">
                </form>
            </div>

            <!-- Movement Register Table -->
            <div class="bg-white rounded-xl border border-gray-200 overflow-hidden">

                <div class="overflow-x-auto">
                    <table class="w-full">

                        <thead class="bg-gray-50 border-b border-gray-200">
                        <tr>
                            <th class="px-6 py-4 text-left text-sm font-semibold">Employee</th>
                            <th class="px-6 py-4 text-left text-sm font-semibold">Department</th>
                            <th class="px-6 py-4 text-left text-sm font-semibold">Leave Type</th>
                            <th class="px-6 py-4 text-left text-sm font-semibold">Start Date</th>
                            <th class="px-6 py-4 text-left text-sm font-semibold">End Date</th>
                            <th class="px-6 py-4 text-center text-sm font-semibold">Duration</th>
                        </tr>
                        </thead>

                        <tbody class="divide-y divide-gray-200">

                        <!-- Leave Rows -->
                        <tr th:each="leave : ${leavePage.content}"
                            class="hover:bg-gray-50">

                            <td class="px-6 py-4 font-medium text-gray-900"
                                th:text="${leave.employeeName}">
                            </td>

                            <td class="px-6 py-4 text-sm text-gray-600"
                                th:text="${leave.department}">
                            </td>

                            <td class="px-6 py-4">
                                <span class="px-3 py-1 rounded-lg text-sm font-medium bg-blue-100 text-blue-700"
                                      th:text="${leave.leaveType}">
                                </span>
                            </td>

                            <td class="px-6 py-4 text-sm text-gray-900"
                                th:text="${leave.startDate}">
                            </td>

                            <td class="px-6 py-4 text-sm text-gray-900"
                                th:text="${leave.endDate}">
                            </td>

                            <td class="px-6 py-4 text-center text-sm font-semibold text-gray-900"
                                th:text="${T(java.time.temporal.ChronoUnit).DAYS
                                    .between(leave.startDate, leave.endDate) + 1 + ' days'}">
                            </td>
                        </tr>

                        <!-- No Data -->
                        <tr th:if="${leavePage.totalElements == 0}">
                            <td colspan="6" class="px-6 py-6 text-center text-gray-500">
                                No employees on leave for the selected month.
                            </td>
                        </tr>

                        </tbody>
                    </table>
                </div>

                <!-- Pagination Footer -->
                <div class="px-6 py-4 border-t border-gray-200 bg-gray-50">
                    <div class="flex items-center justify-between">

                        <!-- Page Size -->
                        <form method="get" th:action="@{/staff/movement-register}">
                            <span class="text-sm text-gray-700 mr-2">Items per page:</span>
                            <select name="size"
                                    class="px-3 py-1 border rounded-lg text-sm"
                                    onchange="this.form.submit()">
                                <option value="3" th:selected="${pageSize == 3}">3</option>
                                <option value="6" th:selected="${pageSize == 6}">6</option>
                                <option value="9" th:selected="${pageSize == 9}">9</option>
                            </select>
                            <input type="hidden" name="month" th:value="${selectedMonth}">
                        </form>

                        <!-- Page Info -->
                        <div class="text-sm text-gray-700">
                            Page <span th:text="${leavePage.number + 1}"></span>
                            of <span th:text="${leavePage.totalPages}"></span>
                        </div>

                        <!-- Navigation -->
                        <div class="flex items-center gap-2">

                            <a th:if="${leavePage.hasPrevious()}"
                               th:href="@{/staff/movement-register(
                                    page=${leavePage.number - 1},
                                    size=${pageSize},
                                    month=${selectedMonth})}"
                               class="px-3 py-1 border rounded-lg text-sm">
                                Previous
                            </a>

                            <a th:if="${leavePage.hasNext()}"
                               th:href="@{/staff/movement-register(
                                    page=${leavePage.number + 1},
                                    size=${pageSize},
                                    month=${selectedMonth})}"
                               class="px-3 py-1 border rounded-lg text-sm">
                                Next
                            </a>

                        </div>

                    </div>
                </div>
    </main>
</div>
</body>
</html>
