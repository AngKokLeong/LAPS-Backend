<!DOCTYPE html>
<html lang="en">
<head>
	  <head th:replace="~{fragments/common_header :: head('View Leaves - Leave Management System')}">
</head>
<body class="bg-gray-50">
    <div class="flex min-h-screen">
		<!-- Dynamic Navigation Sidebar -->
		<div th:replace="~{fragments/layout-parts :: dynamic_sidebar}"></div>

        <!-- Main Content -->
        <main class="flex-1 p-8">
            <div class="mb-8">
                <h1 class="text-3xl font-semibold text-gray-900">My Leave Requests</h1>
                <p class="text-gray-500 mt-1">View and manage your leave requests</p>
            </div>

            <!-- Filter Tabs -->
            <div class="mb-6 flex items-center gap-2 border-b border-gray-200">
                <button class="px-4 py-3 text-blue-600 border-b-2 border-blue-600 font-medium">
                    All (8)
                </button>
                <button class="px-4 py-3 text-gray-600 hover:text-gray-900">
                    Pending (2)
                </button>
                <button class="px-4 py-3 text-gray-600 hover:text-gray-900">
                    Approved (5)
                </button>
                <button class="px-4 py-3 text-gray-600 hover:text-gray-900">
                    Rejected (1)
                </button>
            </div>

            <!-- Leave Requests List -->
            <div class="space-y-4">
                <!-- Pending Leave Request -->


                <div class="bg-white rounded-xl border border-gray-200 p-6 hover:shadow-lg transition-shadow" th:each="leave_request : ${leave_request_list}">
                    <div class="flex items-start justify-between mb-4">
                        <div class="flex items-center gap-4">
                            <div class="w-12 h-12 rounded-lg flex items-center justify-center" style="background-color: rgba(59, 130, 246, 0.2);">
                                <svg class="w-6 h-6" style="color: #3b82f6;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                                </svg>
                            </div>
                            <div>
                                <h3 class="font-semibold text-gray-900" th:text="${leave_request.type}"></h3>
                                <p class="text-sm text-gray-500 mt-1" th:text="${leave_request.leavePeriod}"></p>
                            </div>
                        </div>
                        <div th:switch="${leave_request.leaveRequestStatus}">
                            <span th:case="'PENDING'" class="inline-flex px-3 py-1 rounded-full text-sm font-medium bg-yellow-100 text-yellow-700 border border-yellow-200">Pending</span>
                            <span th:case="'APPROVED'" class="inline-flex px-3 py-1 rounded-full text-sm font-medium bg-green-100 text-green-700 border border-green-200">Approved</span>
                            <span th:case="'REJECTED'" class="inline-flex px-3 py-1 rounded-full text-sm font-medium bg-red-100 text-red-700 border border-red-200">Rejected</span>
                            <span th:case="'CANCELLED'" class="inline-flex px-3 py-1 rounded-full text-sm font-medium bg-orange-100 text-orange-700 border border-orange-200">Cancelled</span>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
                        <div>
                            <p class="text-xs text-gray-500 mb-1">Duration</p>
                            <p class="text-sm font-medium text-gray-900" th:text="${leave_request.leavePeriod}"></p>
                        </div>
                        <div>
                            <p class="text-xs text-gray-500 mb-1">Applied On</p>
                            <p class="text-sm font-medium text-gray-900" th:text="${leave_request.leaveAppliedOn}"></p>
                        </div>
                        <div>
                            <p class="text-xs text-gray-500 mb-1">Approver</p>
                            <p class="text-sm font-medium text-gray-900" th:text="${leave_request.leaveApprover}"></p>
                        </div>
                    </div>

                    <div class="bg-gray-50 rounded-lg p-3 mb-4">
                        <p class="text-xs text-gray-500 mb-1">Reason</p>
                        <p class="text-sm text-gray-700" th:text="${leave_request.reason}"></p>
                    </div>

                    <div th:switch="${leave_request.leaveRequestStatus}">
                        <div th:case="'PENDING'" >
                            <div class="flex gap-2">
                                <button class=" w-full px-4 py-2 text-sm text-red-600 border border-red-300 rounded-lg hover:bg-red-50 transition-colors">
                                    Cancel Request
                                </button>
                            </div>
                        </div>

                        <div th:case="'APPROVED'">
                            <div class="bg-green-50 border border-green-200 rounded-lg p-3 mb-4">
                                <div class="flex items-start gap-2">
                                    <svg class="w-5 h-5 text-green-600 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                                    </svg>
                                    <div>
                                        <p class="text-sm font-medium text-green-900" text="Approved on " th:text="${leave_request.leaveApprovalTransactionDate}">Approved on March 19, 2026</p>
                                        <p class="text-xs text-green-700 mt-1"  th:text="${leave_request.leaveApprovalReason}">Sarah Manager</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div th:case="'REJECTED'">
                            <div class="bg-red-50 border border-red-200 rounded-lg p-3 mb-4">
                                <div class="flex items-start gap-2">
                                    <svg class="w-5 h-5 text-red-600 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                                    </svg>
                                    <div>
                                        <p class="text-sm font-medium text-red-900" th:text="${leave_request.leaveApprovalTransactionDate}"></p>
                                        <p class="text-xs text-red-700 mt-1"  th:text="${leave_request.leaveApprovalReason}"></p>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div th:case="'CANCELLED'">
                            <div class="bg-orange-50 border border-orange-200 rounded-lg p-3 mb-4">
                                <div class="flex items-start gap-2">
                                    <svg class="w-5 h-5 text-orange-600 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                                    </svg>
                                    <div>
                                        <p class="text-sm font-medium text-orange-900" th:text="${leave_request.leaveApprovalTransactionDate}"></p>
                                        <p class="text-xs text-orange-700 mt-1"  th:text="${leave_request.leaveApprovalReason}"></p>
                                    </div>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>

            </div>
        </main>
    </div>
</body>
</html>
