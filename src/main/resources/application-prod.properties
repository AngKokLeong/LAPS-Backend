spring.application.name=leave_application_processing_system

server.port=8100
server.servlet.context-path=/laps

# Disable management context to avoid circular server.port reference in WAR deployment
management.server.port=

# To use DataInitializer
spring.jpa.defer-datasource-initialization=false

spring.datasource.url=${spring.datasource.url}
spring.datasource.username=${spring.datasource.username}
spring.datasource.password=${spring.datasource.password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Recreate database on every start
spring.jpa.hibernate.ddl-auto=create-drop

# Suppress harmless drop table warnings on first startup
spring.jpa.properties.hibernate.hbm2ddl.halt_on_error=false

# Disable open-in-view warning
spring.jpa.open-in-view=false

# Set timeout to 30 minutes
server.servlet.session.timeout=30m

# Expose actuator health endpoint for ALB health checks
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never