<!DOCTYPE html>
<html lang="en">
	<head th:replace="~{fragments/common_header :: head('Login - Leave Management System')}">
	</head>


<body class="bg-gray-50">
    <div class="min-h-screen flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-8">
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-16 h-16 bg-blue-100 rounded-full mb-4">
                    <svg class="w-8 h-8 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                    </svg>
                </div>
                <h1 class="text-2xl font-semibold text-gray-900">Leave Management System</h1>
                <p class="text-gray-500 mt-2">Sign in to your account</p>
            </div>
			
			<div th:if="${param.logout}" 
			     class="mb-6 p-4 bg-green-50 border border-green-200 text-green-700 rounded-lg text-sm flex items-center" 
			     role="alert">
			    <svg class="w-5 h-5 mr-3 text-green-500" fill="currentColor" viewBox="0 0 20 20">
			        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path>
			    </svg>
			    <span>You have successfully logged out.</span>
			</div>

			<div th:if="${param.error}"
			     class="mb-6 p-4 bg-red-50 border border-red-200 text-red-700 rounded-lg text-sm flex items-center"
			     role="alert">
			    <span>Invalid email or password.</span>
			</div>

            <form class="space-y-4" th:action="@{/authenticate/login}" th:object="${authenticationUser}" method="POST">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Email Address</label>
                    <input 
                        type="email" 
                        placeholder="your.email@company.com"
						id="email" 
						name="email" 
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                    >
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Password</label>
                    <input 
                        type="password" 
                        placeholder="••••••••"
						id="password" name="password"
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                    >
                </div>

                <button 
                    type="submit"
                    class="w-full py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors font-medium"
                >
                    Sign In
                </button>
                <b th:text="${test}"></b>
            </form>

            <div class="mt-8 pt-6 border-t border-gray-200">
                <p class="text-sm text-gray-600 mb-3">Demo Accounts:</p>
                <div class="space-y-2 text-xs">
                    <div class="flex justify-between p-2 bg-gray-50 rounded">
                        <span class="text-gray-700">Employee:</span>
                        <span class="text-gray-900 font-medium">john@company.com</span>
                    </div>
                    <div class="flex justify-between p-2 bg-gray-50 rounded">
                        <span class="text-gray-700">Manager:</span>
                        <span class="text-gray-900 font-medium">sarah@company.com</span>
                    </div>
                    <div class="flex justify-between p-2 bg-gray-50 rounded">
                        <span class="text-gray-700">Admin:</span>
                        <span class="text-gray-900 font-medium">admin@company.com</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
