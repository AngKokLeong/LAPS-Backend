name: Build and Deploy

on:
  workflow_dispatch:
    inputs:
      aws_access_key_id:
        description: 'AWS Access Key ID'
        required: true
      aws_secret_access_key:
        description: 'AWS Secret Access Key'
        required: true
      aws_session_token:
        description: 'AWS Session Token'
        required: true
      stack_name:
        description: 'CloudFormation Stack Name'
        required: true
      s3_bucket:
        description: 'S3 Artifact Bucket Name'
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'corretto'

      - name: Build WAR
        run: mvn clean package -DskipTests

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          aws-access-key-id: ${{ github.event.inputs.aws_access_key_id }}
          aws-secret-access-key: ${{ github.event.inputs.aws_secret_access_key }}
          aws-session-token: ${{ github.event.inputs.aws_session_token }}
          aws-region: us-east-1

      - name: Upload to S3
        run: |
          aws deploy push \
            --application-name ${{ github.event.inputs.stack_name }}-app \
            --s3-location s3://${{ github.event.inputs.s3_bucket }}/app-artifact.zip \
            --source .

      - name: Trigger CodeDeploy
        run: |
          aws deploy create-deployment \
            --application-name ${{ github.event.inputs.stack_name }}-app \
            --deployment-group-name ${{ github.event.inputs.stack_name }}-dg \
            --s3-location bucket=${{ github.event.inputs.s3_bucket }},key=app-artifact.zip,bundleType=zip
