<!DOCTYPE html>
<html lang="en">
<head th:replace="~{fragments/common_header :: head('Team Leave History - Leave Management System')}">
</head>

<body class="bg-gray-50">
	<div class="flex min-h-screen">
		
		<!-- Manager Navigation Sidebar -->
		<div th:replace="~{fragments/manager_left_navigation_bar :: manager_navigation_bar('Manager')}"></div>

        <!-- Main Content -->
        <main class="flex-1 p-8">
            <div class="mb-8">
                <h1 class="text-3xl font-semibold text-gray-900">Team Leave History</h1>
                <p class="text-gray-500 mt-1">View all reviewed leave requests from your team</p>
            </div>

            <!-- Team Leave History Table -->
            <div class="bg-white rounded-xl border border-gray-200 overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full">
                        <thead class="bg-gray-50 border-b border-gray-200">
                            <tr>
                                <th class="px-6 py-4 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                    Employee
                                </th>
                                <th class="px-6 py-4 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                    Leave Type
                                </th>
                                <th class="px-6 py-4 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                    Duration
                                </th>
                                <th class="px-6 py-4 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                    Days
                                </th>
                                <th class="px-6 py-4 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                    Status
                                </th>
                                <th class="px-6 py-4 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                    Reviewed By
                                </th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-gray-200" th:each="leave : ${subordinateLeaveHistory}">
                            <div th:if="${#strings.toString(leave.leaveStatus) == 'REJECTED' or #strings.toString(leave.leaveStatus) == 'APPROVED'}">
                                
                                <tr class="hover:bg-gray-50 transition-colors" >
                                    <td class="px-6 py-4 whitespace-nowrap">
                                        <div class="flex items-center gap-3">
                                            <div class="w-10 h-10 bg-gradient-to-br from-blue-500 to-blue-600 rounded-full flex items-center justify-center">
                                                <span class="text-white font-medium text-sm"
                                                    th:text="${#strings.substring(leave.staffName, 0, 1) + (leave.staffName.length() > 1 ? #strings.substring(leave.staffName, 1, 2) : '')}">
                                                    NA
                                                </span>
                                            </div>
                                            <div>
                                                <p class="font-medium text-gray-900" th:text="${leave.staffName}">Employee Name</p>
                                                <p class="text-sm text-gray-500" th:text="${leave.staffDesignation}">Designation</p>
                                            </div>
                                        </div>
                                    </td>
                                    <td class="px-6 py-4 whitespace-nowrap">
                                        <span class="text-sm text-gray-900 capitalize" th:text="${leave.leaveType}">Leave Type</span>
                                    </td>
                                    <td class="px-6 py-4 whitespace-nowrap">
                                        <div class="text-sm text-gray-900" th:text="${leave.leaveDuration}">Duration</div>
                                    </td>
                                    <td class="px-6 py-4 whitespace-nowrap">
                                        <span class="text-sm text-gray-900" th:text="${leave.numberOfLeaveDay}">Days</span>
                                    </td>
                                    <td class="px-6 py-4 whitespace-nowrap">

                                        <div th:switch="${#strings.toString(leave.leaveStatus)}">
                                            <span th:case="'APPROVED'" class="inline-flex px-3 py-1 rounded-full text-xs font-medium border bg-green-50 text-green-700 border-green-200">
                                                Approved
                                            </span>
                                            <span th:case="'REJECTED'" class="inline-flex px-3 py-1 rounded-full text-xs font-medium border bg-red-50 text-red-700 border-red-200">
                                                Rejected
                                            </span>
                                        </div>                                    
                                        
                                    </td>
                                    <td class="px-6 py-4 whitespace-nowrap">
                                        <div class="text-sm">
                                            <p class="text-gray-900" th:text="${leave.reviewBy}">Reviewer</p>
                                            <p class="text-gray-500 text-xs" th:text="${#dates.format(leave.leaveRequestUpdatedDate, 'MMM d')}">Review Date</p>
                                        </div>
                                    </td>
                                </tr>
                            </div>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
