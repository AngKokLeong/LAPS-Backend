apiVersion: apps/v1
kind: Deployment
metadata:
  name: laps-backend
  namespace: laps
spec:
  replicas: 2
  selector:
    matchLabels:
      app: laps-backend
  template:
    metadata:
      labels:
        app: laps-backend
    spec:
      containers:
        - name: laps-backend
          image: PLACEHOLDER_IMAGE
          ports:
            - containerPort: 8100
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                secretKeyRef:
                  name: laps-secrets
                  key: datasource-url
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: laps-secrets
                  key: datasource-username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: laps-secrets
                  key: datasource-password
          readinessProbe:
            httpGet:
              path: /laps/actuator/health
              port: 8100
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /laps/actuator/health
              port: 8100
            initialDelaySeconds: 60
            periodSeconds: 15
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
