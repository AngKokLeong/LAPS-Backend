name: Deploy to ECS

on:
  workflow_dispatch:
    inputs:
      aws_access_key_id:
        description: 'AWS Access Key ID'
        required: true
      aws_secret_access_key:
        description: 'AWS Secret Access Key'
        required: true
      aws_session_token:
        description: 'AWS Session Token'
        required: true
      aws_account_id:
        description: 'AWS Account ID'
        required: true
      db_username:
        description: 'DB Username'
        required: true
      db_password:
        description: 'DB Password'
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLUSTER_NAME: laps-backend-cluster
      SERVICE_NAME: laps-backend-service
      TASK_FAMILY: laps-backend-task
      CONTAINER_NAME: laps-backend
      REGION: us-east-1
      LAB_ROLE_ARN: arn:aws:iam::${{ github.event.inputs.aws_account_id }}:role/LabRole

    steps:
      - uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'corretto'

      - name: Build WAR
        run: mvn clean package -DskipTests

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          aws-access-key-id: ${{ github.event.inputs.aws_access_key_id }}
          aws-secret-access-key: ${{ github.event.inputs.aws_secret_access_key }}
          aws-session-token: ${{ github.event.inputs.aws_session_token }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Create ECR Repository if not exists
        run: |
          aws ecr describe-repositories --repository-names laps-backend --region $REGION || \
          aws ecr create-repository --repository-name laps-backend --region $REGION

      - name: Build and Push Docker Image to ECR
        env:
          ECR_REGISTRY: ${{ github.event.inputs.aws_account_id }}.dkr.ecr.us-east-1.amazonaws.com
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/laps-backend:$IMAGE_TAG .
          docker push $ECR_REGISTRY/laps-backend:$IMAGE_TAG
          docker tag $ECR_REGISTRY/laps-backend:$IMAGE_TAG $ECR_REGISTRY/laps-backend:latest
          docker push $ECR_REGISTRY/laps-backend:latest
          echo "ECR_IMAGE=$ECR_REGISTRY/laps-backend:$IMAGE_TAG" >> $GITHUB_ENV

      - name: Setup RDS MySQL Database
        run: |
          DB_STATUS=$(aws rds describe-db-instances \
            --db-instance-identifier laps-backend-db \
            --query 'DBInstances[0].DBInstanceStatus' \
            --output text \
            --region $REGION 2>/dev/null || echo "not-found")

          if [ "$DB_STATUS" == "not-found" ]; then
            echo "Creating RDS MySQL instance..."

            VPC_ID=$(aws ec2 describe-vpcs \
              --filters "Name=isDefault,Values=true" \
              --query "Vpcs[0].VpcId" \
              --output text --region $REGION)

            SUBNET_IDS=$(aws ec2 describe-subnets \
              --filters "Name=vpc-id,Values=$VPC_ID" \
              --query "Subnets[*].SubnetId" \
              --output text --region $REGION | tr '\t' ',')

            aws rds create-db-subnet-group \
              --db-subnet-group-name laps-backend-subnet-group \
              --db-subnet-group-description "LAPS Backend DB Subnet Group" \
              --subnet-ids $(echo $SUBNET_IDS | tr ',' ' ') \
              --region $REGION || true

            SG_ID=$(aws ec2 create-security-group \
              --group-name laps-rds-sg \
              --description "LAPS RDS Security Group" \
              --vpc-id $VPC_ID \
              --query 'GroupId' \
              --output text --region $REGION)

            aws ec2 authorize-security-group-ingress \
              --group-id $SG_ID \
              --protocol tcp \
              --port 3306 \
              --cidr 0.0.0.0/0 \
              --region $REGION

            aws rds create-db-instance \
              --db-instance-identifier laps-backend-db \
              --db-instance-class db.t3.micro \
              --engine mysql \
              --engine-version 8.0 \
              --master-username ${{ github.event.inputs.db_username }} \
              --master-user-password ${{ github.event.inputs.db_password }} \
              --db-name lapsdb \
              --db-subnet-group-name laps-backend-subnet-group \
              --vpc-security-group-ids $SG_ID \
              --allocated-storage 20 \
              --no-multi-az \
              --no-publicly-accessible \
              --backup-retention-period 0 \
              --no-deletion-protection \
              --region $REGION

            echo "Waiting for RDS to be available (this may take 5-10 minutes)..."
            aws rds wait db-instance-available \
              --db-instance-identifier laps-backend-db \
              --region $REGION

            echo "RDS instance created successfully"
          else
            echo "RDS instance already exists with status: $DB_STATUS"
          fi

          RDS_ENDPOINT=$(aws rds describe-db-instances \
            --db-instance-identifier laps-backend-db \
            --query 'DBInstances[0].Endpoint.Address' \
            --output text --region $REGION)
          echo "RDS_ENDPOINT=$RDS_ENDPOINT" >> $GITHUB_ENV
          echo "RDS Endpoint: $RDS_ENDPOINT"

      - name: Create ACM Certificate if not exists
        run: |
          CERT_ARN=$(aws acm list-certificates \
            --query "CertificateSummaryList[?DomainName=='laps-backend.local'].CertificateArn" \
            --output text --region $REGION)

          if [ -z "$CERT_ARN" ]; then
            echo "Creating self-signed certificate in ACM..."

            openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
              -keyout /tmp/tls.key \
              -out /tmp/tls.crt \
              -subj "/CN=laps-backend.local/O=LAPS"

            CERT_ARN=$(aws acm import-certificate \
              --certificate fileb:///tmp/tls.crt \
              --private-key fileb:///tmp/tls.key \
              --query 'CertificateArn' \
              --output text --region $REGION)

            echo "Certificate created: $CERT_ARN"
          else
            echo "Certificate already exists: $CERT_ARN"
          fi

          echo "CERT_ARN=$CERT_ARN" >> $GITHUB_ENV

      - name: Create ECS Cluster if not exists
        run: |
          CLUSTER_STATUS=$(aws ecs describe-clusters \
            --clusters $CLUSTER_NAME \
            --query 'clusters[0].status' \
            --output text --region $REGION 2>/dev/null || echo "not-found")

          if [ "$CLUSTER_STATUS" != "ACTIVE" ]; then
            echo "Creating ECS cluster..."
            aws ecs create-cluster \
              --cluster-name $CLUSTER_NAME \
              --capacity-providers FARGATE FARGATE_SPOT \
              --region $REGION
            echo "ECS cluster created successfully"
          else
            echo "ECS cluster already exists"
          fi

      - name: Create ALB and Target Groups for Blue-Green
        run: |
          VPC_ID=$(aws ec2 describe-vpcs \
            --filters "Name=isDefault,Values=true" \
            --query "Vpcs[0].VpcId" \
            --output text --region $REGION)

          SUBNET_IDS=$(aws ec2 describe-subnets \
            --filters "Name=vpc-id,Values=$VPC_ID" \
            --query "Subnets[*].SubnetId" \
            --output text --region $REGION)

          # Create ALB security group if not exists
          ALB_SG_ID=$(aws ec2 describe-security-groups \
            --filters "Name=group-name,Values=laps-alb-sg" "Name=vpc-id,Values=$VPC_ID" \
            --query 'SecurityGroups[0].GroupId' \
            --output text --region $REGION 2>/dev/null)

          if [ -z "$ALB_SG_ID" ] || [ "$ALB_SG_ID" == "None" ]; then
            ALB_SG_ID=$(aws ec2 create-security-group \
              --group-name laps-alb-sg \
              --description "LAPS ALB Security Group" \
              --vpc-id $VPC_ID \
              --query 'GroupId' \
              --output text --region $REGION)

            aws ec2 authorize-security-group-ingress \
              --group-id $ALB_SG_ID --protocol tcp --port 80 --cidr 0.0.0.0/0 --region $REGION
            aws ec2 authorize-security-group-ingress \
              --group-id $ALB_SG_ID --protocol tcp --port 443 --cidr 0.0.0.0/0 --region $REGION
          fi

          # Create ALB if not exists
          ALB_ARN=$(aws elbv2 describe-load-balancers \
            --names laps-backend-alb \
            --query 'LoadBalancers[0].LoadBalancerArn' \
            --output text --region $REGION 2>/dev/null)

          if [ -z "$ALB_ARN" ] || [ "$ALB_ARN" == "None" ]; then
            ALB_ARN=$(aws elbv2 create-load-balancer \
              --name laps-backend-alb \
              --subnets $(echo $SUBNET_IDS | tr ' ' ' ') \
              --security-groups $ALB_SG_ID \
              --scheme internet-facing \
              --type application \
              --query 'LoadBalancers[0].LoadBalancerArn' \
              --output text --region $REGION)
            echo "ALB created: $ALB_ARN"
          fi

          # Create blue target group if not exists
          BLUE_TG_ARN=$(aws elbv2 describe-target-groups \
            --names laps-backend-blue-tg \
            --query 'TargetGroups[0].TargetGroupArn' \
            --output text --region $REGION 2>/dev/null)

          if [ -z "$BLUE_TG_ARN" ] || [ "$BLUE_TG_ARN" == "None" ]; then
            BLUE_TG_ARN=$(aws elbv2 create-target-group \
              --name laps-backend-blue-tg \
              --protocol HTTP \
              --port 8100 \
              --vpc-id $VPC_ID \
              --target-type ip \
              --health-check-path /laps/actuator/health \
              --query 'TargetGroups[0].TargetGroupArn' \
              --output text --region $REGION)
          fi

          # Create green target group if not exists
          GREEN_TG_ARN=$(aws elbv2 describe-target-groups \
            --names laps-backend-green-tg \
            --query 'TargetGroups[0].TargetGroupArn' \
            --output text --region $REGION 2>/dev/null)

          if [ -z "$GREEN_TG_ARN" ] || [ "$GREEN_TG_ARN" == "None" ]; then
            GREEN_TG_ARN=$(aws elbv2 create-target-group \
              --name laps-backend-green-tg \
              --protocol HTTP \
              --port 8100 \
              --vpc-id $VPC_ID \
              --target-type ip \
              --health-check-path /laps/actuator/health \
              --query 'TargetGroups[0].TargetGroupArn' \
              --output text --region $REGION)
          fi

          # Create HTTPS listener if not exists
          LISTENER_ARN=$(aws elbv2 describe-listeners \
            --load-balancer-arn $ALB_ARN \
            --query 'Listeners[?Port==`443`].ListenerArn' \
            --output text --region $REGION 2>/dev/null)

          if [ -z "$LISTENER_ARN" ] || [ "$LISTENER_ARN" == "None" ]; then
            LISTENER_ARN=$(aws elbv2 create-listener \
              --load-balancer-arn $ALB_ARN \
              --protocol HTTPS \
              --port 443 \
              --certificates CertificateArn=$CERT_ARN \
              --default-actions Type=forward,TargetGroupArn=$BLUE_TG_ARN \
              --query 'Listeners[0].ListenerArn' \
              --output text --region $REGION)

            # HTTP redirect to HTTPS
            aws elbv2 create-listener \
              --load-balancer-arn $ALB_ARN \
              --protocol HTTP \
              --port 80 \
              --default-actions Type=redirect,RedirectConfig="{Protocol=HTTPS,Port=443,StatusCode=HTTP_301}" \
              --region $REGION
          fi

          ALB_DNS=$(aws elbv2 describe-load-balancers \
            --load-balancer-arns $ALB_ARN \
            --query 'LoadBalancers[0].DNSName' \
            --output text --region $REGION)

          echo "ALB_ARN=$ALB_ARN" >> $GITHUB_ENV
          echo "BLUE_TG_ARN=$BLUE_TG_ARN" >> $GITHUB_ENV
          echo "GREEN_TG_ARN=$GREEN_TG_ARN" >> $GITHUB_ENV
          echo "LISTENER_ARN=$LISTENER_ARN" >> $GITHUB_ENV
          echo "ALB_DNS=$ALB_DNS" >> $GITHUB_ENV

      - name: Determine Blue-Green Active Slot
        run: |
          ACTIVE_TG=$(aws elbv2 describe-listeners \
            --listener-arns $LISTENER_ARN \
            --query 'Listeners[0].DefaultActions[0].TargetGroupArn' \
            --output text --region $REGION 2>/dev/null || echo "$BLUE_TG_ARN")

          if [ "$ACTIVE_TG" == "$BLUE_TG_ARN" ]; then
            ACTIVE_SLOT="blue"
            DEPLOY_SLOT="green"
            DEPLOY_TG_ARN=$GREEN_TG_ARN
          else
            ACTIVE_SLOT="green"
            DEPLOY_SLOT="blue"
            DEPLOY_TG_ARN=$BLUE_TG_ARN
          fi

          echo "Active slot  : $ACTIVE_SLOT"
          echo "Deploy slot  : $DEPLOY_SLOT"
          echo "ACTIVE_SLOT=$ACTIVE_SLOT" >> $GITHUB_ENV
          echo "DEPLOY_SLOT=$DEPLOY_SLOT" >> $GITHUB_ENV
          echo "DEPLOY_TG_ARN=$DEPLOY_TG_ARN" >> $GITHUB_ENV

      - name: Register ECS Task Definition
        run: |
          TASK_DEF=$(cat <<EOF
          {
            "family": "$TASK_FAMILY-$DEPLOY_SLOT",
            "networkMode": "awsvpc",
            "requiresCompatibilities": ["FARGATE"],
            "cpu": "512",
            "memory": "1024",
            "executionRoleArn": "$LAB_ROLE_ARN",
            "taskRoleArn": "$LAB_ROLE_ARN",
            "containerDefinitions": [
              {
                "name": "$CONTAINER_NAME",
                "image": "$ECR_IMAGE",
                "portMappings": [{"containerPort": 8100, "protocol": "tcp"}],
                "environment": [
                  {"name": "SPRING_PROFILES_ACTIVE", "value": "prod"},
                  {"name": "spring.datasource.url", "value": "jdbc:mysql://$RDS_ENDPOINT:3306/lapsdb?createDatabaseIfNotExist=true"},
                  {"name": "spring.datasource.username", "value": "${{ github.event.inputs.db_username }}"},
                  {"name": "spring.datasource.password", "value": "${{ github.event.inputs.db_password }}"}
                ],
                "logConfiguration": {
                  "logDriver": "awslogs",
                  "options": {
                    "awslogs-group": "/ecs/laps-backend",
                    "awslogs-region": "$REGION",
                    "awslogs-stream-prefix": "ecs",
                    "awslogs-create-group": "true"
                  }
                },
                "healthCheck": {
                  "command": ["CMD-SHELL", "curl -f http://localhost:8100/laps/actuator/health || exit 1"],
                  "interval": 30,
                  "timeout": 10,
                  "retries": 3,
                  "startPeriod": 60
                }
              }
            ]
          }
          EOF
          )

          TASK_DEF_ARN=$(echo $TASK_DEF | aws ecs register-task-definition \
            --cli-input-json file:///dev/stdin \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text --region $REGION)

          echo "TASK_DEF_ARN=$TASK_DEF_ARN" >> $GITHUB_ENV
          echo "Task definition registered: $TASK_DEF_ARN"

      - name: Create or Update ECS Service on Inactive Slot
        run: |
          VPC_ID=$(aws ec2 describe-vpcs \
            --filters "Name=isDefault,Values=true" \
            --query "Vpcs[0].VpcId" \
            --output text --region $REGION)

          SUBNET_IDS=$(aws ec2 describe-subnets \
            --filters "Name=vpc-id,Values=$VPC_ID" \
            --query "Subnets[*].SubnetId" \
            --output text --region $REGION | tr '\t' ',')

          # Create ECS security group if not exists
          ECS_SG_ID=$(aws ec2 describe-security-groups \
            --filters "Name=group-name,Values=laps-ecs-sg" "Name=vpc-id,Values=$VPC_ID" \
            --query 'SecurityGroups[0].GroupId' \
            --output text --region $REGION 2>/dev/null)

          if [ -z "$ECS_SG_ID" ] || [ "$ECS_SG_ID" == "None" ]; then
            ECS_SG_ID=$(aws ec2 create-security-group \
              --group-name laps-ecs-sg \
              --description "LAPS ECS Security Group" \
              --vpc-id $VPC_ID \
              --query 'GroupId' \
              --output text --region $REGION)

            aws ec2 authorize-security-group-ingress \
              --group-id $ECS_SG_ID --protocol tcp --port 8100 --cidr 0.0.0.0/0 --region $REGION
          fi

          DEPLOY_SERVICE="$SERVICE_NAME-$DEPLOY_SLOT"

          SERVICE_STATUS=$(aws ecs describe-services \
            --cluster $CLUSTER_NAME \
            --services $DEPLOY_SERVICE \
            --query 'services[0].status' \
            --output text --region $REGION 2>/dev/null || echo "not-found")

          if [ "$SERVICE_STATUS" == "ACTIVE" ]; then
            echo "Updating existing ECS service: $DEPLOY_SERVICE"
            aws ecs update-service \
              --cluster $CLUSTER_NAME \
              --service $DEPLOY_SERVICE \
              --task-definition $TASK_DEF_ARN \
              --desired-count 2 \
              --region $REGION
          else
            echo "Creating new ECS service: $DEPLOY_SERVICE"
            aws ecs create-service \
              --cluster $CLUSTER_NAME \
              --service-name $DEPLOY_SERVICE \
              --task-definition $TASK_DEF_ARN \
              --desired-count 2 \
              --launch-type FARGATE \
              --network-configuration "awsvpcConfiguration={subnets=[$(echo $SUBNET_IDS | tr ',' ',')],securityGroups=[$ECS_SG_ID],assignPublicIp=ENABLED}" \
              --load-balancers "targetGroupArn=$DEPLOY_TG_ARN,containerName=$CONTAINER_NAME,containerPort=8100" \
              --region $REGION
          fi

      - name: Wait for Inactive Slot to be Stable
        run: |
          echo "Waiting for $SERVICE_NAME-$DEPLOY_SLOT to be stable..."
          aws ecs wait services-stable \
            --cluster $CLUSTER_NAME \
            --services $SERVICE_NAME-$DEPLOY_SLOT \
            --region $REGION
          echo "Service is stable"

      - name: Verify Health of Inactive Slot
        run: |
          echo "Verifying health of $DEPLOY_SLOT target group..."
          sleep 30

          HEALTHY=$(aws elbv2 describe-target-health \
            --target-group-arn $DEPLOY_TG_ARN \
            --query 'TargetHealthDescriptions[?TargetHealth.State==`healthy`] | length(@)' \
            --output text --region $REGION)

          echo "Healthy targets: $HEALTHY"
          if [ "$HEALTHY" -lt "1" ]; then
            echo "No healthy targets found in $DEPLOY_SLOT slot, aborting deployment"
            exit 1
          fi
          echo "Health check passed for $DEPLOY_SLOT slot"

      - name: Switch Traffic to New Slot
        run: |
          aws elbv2 modify-listener \
            --listener-arn $LISTENER_ARN \
            --default-actions Type=forward,TargetGroupArn=$DEPLOY_TG_ARN \
            --region $REGION
          echo "Traffic switched from $ACTIVE_SLOT to $DEPLOY_SLOT"

      - name: Scale Down Old Slot
        run: |
          aws ecs update-service \
            --cluster $CLUSTER_NAME \
            --service $SERVICE_NAME-$ACTIVE_SLOT \
            --desired-count 0 \
            --region $REGION 2>/dev/null || true
          echo "Scaled down $ACTIVE_SLOT slot"

      - name: Get Deployment Outputs
        run: |
          RDS_ENDPOINT=$(aws rds describe-db-instances \
            --db-instance-identifier laps-backend-db \
            --query 'DBInstances[0].Endpoint.Address' \
            --output text --region $REGION)

          echo "========================================"
          echo "Active Slot         : $DEPLOY_SLOT"
          echo "ECS Application URL : https://$ALB_DNS/laps"
          echo "RDS Endpoint        : $RDS_ENDPOINT"
          echo "ACM Certificate ARN : $CERT_ARN"
          echo "========================================"
