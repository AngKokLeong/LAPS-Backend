spring.application.name=leave_application_processing_system

server.port=8100

# To use H2 + DataInitializer
spring.profiles.active=local
spring.jpa.defer-datasource-initialization=false

# To use MySQL + import.sql
# spring.profiles.active=dev

#H2 Settings
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:datajpa
spring.datasource.username=sa
spring.datasource.password=123
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

#Enabling the H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.trace=false
spring.h2.console.settings.web-allow-others=false

# Recreate database on every start
spring.jpa.hibernate.ddl-auto=create-drop

# Show the SQL in console
spring.jpa.show-sql=true


# Set timeout to 30 minutes
server.servlet.session.timeout=30m